name: supply-chain

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
    steps:
      - uses: actions/checkout@v4

      - name: Filter changed paths
        uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            rust:
              - 'external/ckb-light-client/**'
              - '.github/workflows/supply-chain.yml'

  cargo-audit:
    needs: changes
    if: needs.changes.outputs.rust == 'true' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Install pinned Rust toolchain
        working-directory: external/ckb-light-client
        run: rustup show

      - name: Cache Cargo registry and advisory database
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/advisory-db
          key: cargo-audit-db-${{ hashFiles('external/ckb-light-client/Cargo.lock') }}
          restore-keys: cargo-audit-db-

      - name: Cache cargo-audit binary
        id: cache-audit-bin
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-audit
          key: cargo-audit-bin-${{ runner.os }}-1

      - name: Install cargo-audit
        if: steps.cache-audit-bin.outputs.cache-hit != 'true'
        run: cargo install cargo-audit --locked

      - name: cargo audit
        working-directory: external/ckb-light-client
        run: cargo audit

  cargo-deny:
    needs: changes
    if: needs.changes.outputs.rust == 'true' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: cargo deny check
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: external/ckb-light-client/Cargo.toml
          # Keep in sync with external/ckb-light-client/rust-toolchain.
          rust-version: "1.92.0"

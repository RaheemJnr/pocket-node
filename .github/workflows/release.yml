name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to build (v plus letters, digits, dots, underscores or hyphens)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  # Job 1: build the native library + UNSIGNED release APK. Runs the untrusted
  # Cargo/Gradle build. The keystore private key is NEVER present in this job's
  # process environment (F4 follow-up) — only the PUBLIC RELEASE_CERT_SHA256
  # fingerprint, which is baked into the APK at build time.
  build:
    runs-on: ubuntu-latest
    # Cold cargo build of rocksdb + light-client takes ~10-15 min uncached.
    timeout-minutes: 60
    # Used ONLY to read RELEASE_CERT_SHA256 (a public value). The keystore
    # secrets are not mapped into any step here, so a compromised crate/build
    # script cannot exfiltrate the signing key. If RELEASE_CERT_SHA256 is a
    # repository secret/variable rather than an environment secret, this
    # `environment:` line can be dropped.
    environment: release-signing
    outputs:
      release_tag: ${{ steps.validate_tag.outputs.release_tag }}
      tag_commit: ${{ steps.validate_tag.outputs.tag_commit }}

    steps:
      - name: Checkout release workflow branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Validate release tag provenance
        id: validate_tag
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          WORKFLOW_REF: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          if [ "$WORKFLOW_REF" != "$DEFAULT_BRANCH" ]; then
            echo "::error::Release workflow must be run from the default branch ($DEFAULT_BRANCH), not $WORKFLOW_REF."
            exit 1
          fi

          if [[ ! "$RELEASE_TAG" =~ ^v[0-9A-Za-z._-]+$ ]]; then
            echo "::error::Release tag '$RELEASE_TAG' must use v followed by letters, digits, dots, underscores or hyphens."
            exit 1
          fi

          git fetch --force --tags origin
          git fetch --force origin "+refs/heads/$DEFAULT_BRANCH:refs/remotes/origin/$DEFAULT_BRANCH"

          if ! git rev-parse --verify --quiet "refs/tags/$RELEASE_TAG" >/dev/null; then
            echo "::error::Release tag '$RELEASE_TAG' does not exist."
            exit 1
          fi

          TAG_COMMIT="$(git rev-list -n 1 "$RELEASE_TAG")"
          MAIN_COMMIT="$(git rev-parse "origin/$DEFAULT_BRANCH")"

          if ! git merge-base --is-ancestor "$TAG_COMMIT" "$MAIN_COMMIT"; then
            echo "::error::Release tag '$RELEASE_TAG' ($TAG_COMMIT) is not reachable from origin/$DEFAULT_BRANCH ($MAIN_COMMIT)."
            exit 1
          fi

          echo "Validated release tag $RELEASE_TAG at $TAG_COMMIT."
          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "tag_commit=$TAG_COMMIT" >> "$GITHUB_OUTPUT"

      - name: Checkout validated release tag
        # Check out the verified commit SHA (not the unqualified tag name).
        # An unqualified ref can be resolved by Git/checkout-action to a
        # branch first when a branch shares the tag's short name — an attacker
        # with branch-create + workflow-dispatch perms could create branch
        # v1.7.0 alongside tag v1.7.0, dispatch the workflow with input
        # v1.7.0, pass the tag-provenance validation (which inspects
        # refs/tags/v1.7.0), and then have checkout resolve to the malicious
        # branch. SHAs are unambiguous and cannot be shadowed. (#291)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ steps.validate_tag.outputs.tag_commit }}
          fetch-depth: 0

      - name: Require verified release inputs
        # Historical tags without reviewed metadata must not bypass verification.
        run: |
          test -s android/gradle/verification-metadata.xml
          grep -Eq '^distributionSha256Sum=[0-9a-f]{64}$' android/gradle/wrapper/gradle-wrapper.properties

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Isolate release build inputs
        run: |
          echo "GRADLE_USER_HOME=$(mktemp -d "$RUNNER_TEMP/release-gradle.XXXXXX")" >> "$GITHUB_ENV"
          echo "CARGO_HOME=$(mktemp -d "$RUNNER_TEMP/release-cargo.XXXXXX")" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools

      - name: Setup Android NDK
        # NDK r27c (27.0.12077973) — matches AGP 8.13.2 default. Bump in
        # lockstep with AGP. nttld/setup-ndk handles license + full extraction;
        # sdkmanager produced partial installs missing the llvm toolchain
        # ("clang not found in NDK").
        id: setup-ndk
        uses: nttld/setup-ndk@ed92fe6cadad69be94a966a7ee3271275e62f779 # v1
        with:
          ndk-version: r27c
          add-to-path: false
      - name: Export ANDROID_NDK_HOME
        env:
          NDK_PATH: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: echo "ANDROID_NDK_HOME=$NDK_PATH" >> "$GITHUB_ENV"

      - name: Set up pinned Rust with Android targets
        # Two ABIs only — matches RUST_TARGETS in build-android-jni.sh.
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: "1.95.0"
          targets: aarch64-linux-android,armv7-linux-androideabi

      - name: Write google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
          else
            # Fallback dummy config — Firebase features will be non-functional
            cat > android/app/google-services.json << 'GSEOF'
            {
              "project_info": { "project_number": "0", "project_id": "dummy", "storage_bucket": "dummy.appspot.com" },
              "client": [{ "client_info": { "mobilesdk_app_id": "1:0:android:0", "android_client_info": { "package_name": "com.rjnr.pocketnode" } }, "api_key": [{ "current_key": "dummy" }] }],
              "configuration_version": "1"
            }
          GSEOF
            echo "::warning::GOOGLE_SERVICES_JSON secret not set — using dummy config. Firebase features will be non-functional."
          fi

      - name: Require clean native rebuild and capture reviewed source
        run: |
          set -euo pipefail
          rm -rf external/ckb-light-client/target android/app/src/main/jniLibs release-input
          python3 tools/release/build_provenance.py prepare
          {
            rustc --version
            java -version 2>&1
            cat "$ANDROID_NDK_HOME/source.properties"
          } > release-toolchains.txt

      - name: Build UNSIGNED release APK
        working-directory: android
        # No keystore here — the untrusted Cargo/Gradle build must not run in a
        # process holding the signing key. RELEASE_CERT_SHA256 is public and is
        # baked into the APK so the in-app updater can pin future updates.
        env:
          RELEASE_CERT_SHA256: ${{ secrets.RELEASE_CERT_SHA256 }}
        run: ./gradlew assembleRelease -PunsignedRelease=true --no-build-cache --dependency-verification=strict

      - name: Bind build evidence to unsigned APK and native outputs
        run: python3 tools/release/build_provenance.py finish

      - name: Upload unsigned APK and data-only build provenance
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unsigned-release-apk
          path: |
            release-input/unsigned.apk
            release-input/build-provenance.json
          retention-days: 1
          if-no-files-found: error

  # Job 2: minimal, isolated signing. Holds the keystore, runs ONLY apksigner /
  # zipalign and trusted inline data verification — no release-tag code execution.
  sign:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release-signing

    steps:
      - name: Download unsigned APK
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: unsigned-release-apk
          path: unsigned

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        # Provides apksigner + zipalign from build-tools.
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > release.jks

      - name: Zipalign, sign, and verify
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          RELEASE_CERT_SHA256: ${{ secrets.RELEASE_CERT_SHA256 }}
          RELEASE_TAG: ${{ needs.build.outputs.release_tag }}
        run: |
          set -euo pipefail
          BT="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          UNSIGNED="unsigned/unsigned.apk"
          trap 'rm -f release.jks aligned.apk' EXIT
          OUT="PocketNode-${RELEASE_TAG}.apk"

          "$BT/zipalign" -f -p 4 "$UNSIGNED" aligned.apk
          "$BT/apksigner" sign \
            --ks release.jks \
            --ks-pass "pass:${KEYSTORE_PASSWORD}" \
            --key-pass "pass:${KEY_PASSWORD}" \
            --ks-key-alias "${KEY_ALIAS}" \
            --out "$OUT" aligned.apk
          "$BT/apksigner" verify --print-certs "$OUT" > verified-certificate.txt

          # Fail the release if the signing cert does not match the fingerprint
          # baked into the APK — otherwise the in-app updater would reject this
          # build for every existing user (URL/channel-substitution guard, #293).
          ACTUAL="$(awk -F': ' '/^Signer #1 certificate SHA-256 digest:/{print $2}' verified-certificate.txt | tr 'A-F' 'a-f' | tr -d ': ')"
          EXPECTED="$(printf '%s' "${RELEASE_CERT_SHA256:-}" | tr 'A-F' 'a-f' | tr -d ': ')"
          if [[ ! "$EXPECTED" =~ ^[0-9a-f]{64}$ ]] || [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::Missing/invalid expected certificate or signing certificate mismatch."
            exit 1
          fi

      - name: Generate release verification artifacts
        # Trusted workflow code only. Never execute scripts from the release tag
        # or the downloaded build artifact in this secret-bearing job.
        env:
          RELEASE_TAG: ${{ needs.build.outputs.release_tag }}
          SOURCE_COMMIT: ${{ needs.build.outputs.tag_commit }}
          RELEASE_CERT_SHA256: ${{ secrets.RELEASE_CERT_SHA256 }}
          BUILD_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 - <<'PYVERIFY'
          import hashlib, json, os, re, zipfile
          from pathlib import Path
          def sha(path):
              return hashlib.sha256(path.read_bytes()).hexdigest()
          def native(path):
              with zipfile.ZipFile(path) as apk:
                  names = apk.namelist()
                  if len(names) != len(set(names)):
                      raise SystemExit('duplicate APK entries')
                  return {n: hashlib.sha256(apk.read(n)).hexdigest() for n in names if n.startswith('lib/') and n.endswith('.so')}
          tag = os.environ['RELEASE_TAG']
          if not re.fullmatch(r'v[0-9A-Za-z._-]+', tag):
              raise SystemExit('unsafe release artifact name')
          signed = Path(f'PocketNode-{tag}.apk')
          unsigned = Path('unsigned/unsigned.apk')
          evidence_path = Path('unsigned/build-provenance.json')
          if evidence_path.stat().st_size > 4 * 1024 * 1024:
              raise SystemExit('oversized build evidence')
          evidence = json.loads(evidence_path.read_text())
          if evidence.get('schema_version') != 1 or evidence.get('source_commit') != os.environ['SOURCE_COMMIT']:
              raise SystemExit('source commit/schema mismatch')
          if evidence.get('unsigned_apk_sha256') != sha(unsigned):
              raise SystemExit('unsigned APK digest mismatch')
          packaged = native(signed)
          if packaged != native(unsigned) or packaged != evidence.get('packaged_native_sha256'):
              raise SystemExit('packaged native digest mismatch')
          for abi in ('arm64-v8a', 'armeabi-v7a'):
              if f'lib/{abi}/libckb_light_client_lib.so' not in packaged:
                  raise SystemExit('missing native ABI')
          certs = re.findall(r'^Signer #[0-9]+ certificate SHA-256 digest: ([0-9a-fA-F]{64})$', Path('verified-certificate.txt').read_text(), re.M)
          expected = re.sub(r'[:\s]', '', os.environ['RELEASE_CERT_SHA256']).lower()
          if len(certs) != 1 or not re.fullmatch('[0-9a-f]{64}', expected) or certs[0].lower() != expected:
              raise SystemExit('verified signing certificate mismatch')
          digest = sha(signed)
          Path('SHA256SUMS').write_text(f'{digest}  {signed.name}\n')
          Path('SIGNING-CERTIFICATE-SHA256.txt').write_text(expected + '\n')
          manifest = {'schema_version': 1, 'release_tag': tag, 'source_commit': os.environ['SOURCE_COMMIT'],
                      'build_run_url': os.environ['BUILD_RUN_URL'], 'apk': {'name': signed.name, 'sha256': digest},
                      'signing_certificate_sha256': expected, 'packaged_native_sha256': packaged,
                      'build_evidence_sha256': sha(evidence_path), 'build_evidence': evidence,
                      'limitations': 'Build evidence is supplied by the untrusted build job. Colocated checksums are not independent authenticity proof; this is not an attestation or proof of reproducibility.'}
          Path('release-provenance.json').write_text(json.dumps(manifest, sort_keys=True, indent=2) + '\n')
          PYVERIFY

      - name: Upload signed APK and verification bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: signed-release-bundle
          path: |
            PocketNode-*.apk
            SHA256SUMS
            SIGNING-CERTIFICATE-SHA256.txt
            release-provenance.json
          retention-days: 1
          if-no-files-found: error

  # Job 3: repository-write capability is confined to publishing verified files.
  # No checkout, build tools, signing environment, or signing secrets here.
  publish:
    needs: [build, sign]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - name: Download signed APK and verification bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: signed-release-bundle

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ needs.build.outputs.release_tag }}
          files: |
            PocketNode-*.apk
            SHA256SUMS
            SIGNING-CERTIFICATE-SHA256.txt
            release-provenance.json
          fail_on_unmatched_files: true
          generate_release_notes: true

name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, codex/security-maintenance-batch-1]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # Three sequential unit-test variants take ~40 minutes, plus setup/compilation.
    # Keep all variants and allow headroom for slower hosted runners.
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          # The legacy 'tools' package (the action's default) no longer exists in
          # cmdline-tools 16+ on the GitHub runner image; only platform-tools is needed.
          packages: platform-tools

      - name: Cache Gradle
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ci-android-ci-${{ runner.os }}-gradle-${{ hashFiles('android/**/*.gradle.kts', 'android/gradle/libs.versions.toml', 'android/gradle/verification-metadata.xml', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: ci-android-ci-${{ runner.os }}-gradle-

      # This job validates Kotlin compilation and unit tests. Native release
      # ABI compilation remains a separate mobile integration check.

      - name: Create dummy google-services.json
        run: |
          cat > android/app/google-services.json << 'GSEOF'
          {
            "project_info": { "project_number": "0", "project_id": "dummy", "storage_bucket": "dummy.appspot.com" },
            "client": [{ "client_info": { "mobilesdk_app_id": "1:0:android:0", "android_client_info": { "package_name": "com.rjnr.pocketnode" } }, "api_key": [{ "current_key": "dummy" }] }],
            "configuration_version": "1"
          }
          GSEOF

      - name: Reject control bytes in source
        run: |
          python3 - << 'PYEOF'
          import subprocess, sys
          exts = ('.kt', '.kts', '.rs', '.swift', '.yml', '.yaml', '.toml', '.md')
          files = subprocess.run(['git', 'ls-files'], capture_output=True, text=True, check=True).stdout.splitlines()
          bad = False
          for path in (f for f in files if f.endswith(exts)):
              data = open(path, 'rb').read()
              if any(b < 9 or (10 < b < 13) or (13 < b < 32) for b in data):
                  print(f'::error::control byte in {path}')
                  bad = True
          sys.exit(1 if bad else 0)
          PYEOF

      - name: Run unit tests
        working-directory: android
        run: ./gradlew test :shared:testAndroidHostTest -x cargoBuild

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-results
          path: |
            android/app/build/reports/tests/
            android/shared/build/reports/tests/
          retention-days: 7

  rust-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install pinned Rust toolchain
        working-directory: external/ckb-light-client
        run: rustup show

      - name: Cache Cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            external/ckb-light-client/target
          key: ci-android-ci-${{ runner.os }}-cargo-rust-tests-${{ hashFiles('external/ckb-light-client/Cargo.lock', 'external/ckb-light-client/rust-toolchain') }}
          restore-keys: ci-android-ci-${{ runner.os }}-cargo-rust-tests-

      - name: Verify pinned embedded client and mobile overlay
        run: |
          curl --fail --location --retry 3 https://codeload.github.com/nervosnetwork/ckb-light-client/tar.gz/9ce5fc6507ce1379dd8bd4b947426078bb2062e8 --output "$RUNNER_TEMP/ckb-light-client.tar.gz"
          python3 tools/embedded-client/verify.py --archive "$RUNNER_TEMP/ckb-light-client.tar.gz"

      - name: Run ckb-light-client-lib unit tests
        working-directory: external/ckb-light-client
        run: cargo test -p ckb-light-client-lib --lib

  prev-jni-build:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          # The legacy 'tools' package (the action's default) no longer exists in
          # cmdline-tools 16+ on the GitHub runner image; only platform-tools is needed.
          packages: platform-tools

      - name: Setup Android NDK
        # NDK r27c (27.0.12077973) — matches AGP 8.13.2 default. Bump in
        # lockstep with AGP. nttld/setup-ndk handles license + full extraction;
        # sdkmanager produced partial installs missing the llvm toolchain
        # ("clang not found in NDK").
        id: setup-ndk
        uses: nttld/setup-ndk@ed92fe6cadad69be94a966a7ee3271275e62f779 # v1
        with:
          ndk-version: r27c
          add-to-path: false
      - name: Export ANDROID_NDK_HOME
        env:
          NDK_PATH: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: echo "ANDROID_NDK_HOME=$NDK_PATH" >> "$GITHUB_ENV"

      - name: Set up pinned Rust with Android targets
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: "1.95.0"
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Cache Gradle
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ci-android-ci-${{ runner.os }}-gradle-jni-${{ hashFiles('android/**/*.gradle.kts', 'android/gradle/libs.versions.toml', 'android/gradle/verification-metadata.xml', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: ci-android-ci-${{ runner.os }}-gradle-jni-

      - name: Cache Cargo target
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            external/ckb-light-client/target
          key: ci-android-ci-${{ runner.os }}-cargo-${{ hashFiles('external/ckb-light-client/Cargo.lock') }}
          restore-keys: ci-android-ci-${{ runner.os }}-cargo-

      - name: Create dummy google-services.json
        run: |
          cat > android/app/google-services.json << 'GSEOF'
          {
            "project_info": { "project_number": "0", "project_id": "dummy", "storage_bucket": "dummy.appspot.com" },
            "client": [{ "client_info": { "mobilesdk_app_id": "1:0:android:0", "android_client_info": { "package_name": "com.rjnr.pocketnode" } }, "api_key": [{ "current_key": "dummy" }] }],
            "configuration_version": "1"
          }
          GSEOF

      - name: Build debug APK with JNI + x86_64
        working-directory: android
        env:
          BUILD_X86_64: "1"
        run: ./gradlew assembleDebug

      - name: Upload prev-jni APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pocketnode-prev-jni-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('android/**/*.gradle.kts', 'android/gradle/libs.versions.toml') }}
          restore-keys: gradle-

      # JNI library build is skipped — Rust workspace has a missing dependency
      # (light-client-db-common). Full JNI CI will be restored in Issue #7.
      # For now, CI validates Kotlin compilation and unit tests.

      - name: Create dummy google-services.json
        run: |
          cat > android/app/google-services.json << 'GSEOF'
          {
            "project_info": { "project_number": "0", "project_id": "dummy", "storage_bucket": "dummy.appspot.com" },
            "client": [{ "client_info": { "mobilesdk_app_id": "1:0:android:0", "android_client_info": { "package_name": "com.rjnr.pocketnode" } }, "api_key": [{ "current_key": "dummy" }] }],
            "configuration_version": "1"
          }
          GSEOF

      - name: Run unit tests
        working-directory: android
        run: ./gradlew test -x cargoBuild

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: android/app/build/reports/tests/
          retention-days: 7

  prev-jni-build:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Android NDK
        # NDK r27c (27.0.12077973) — matches AGP 8.13.2 default. Bump in
        # lockstep with AGP. nttld/setup-ndk handles license + full extraction;
        # sdkmanager produced partial installs missing the llvm toolchain
        # ("clang not found in NDK").
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c
          add-to-path: false
      - name: Export ANDROID_NDK_HOME
        env:
          NDK_PATH: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: echo "ANDROID_NDK_HOME=$NDK_PATH" >> $GITHUB_ENV

      - name: Set up Rust (stable + Android targets)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-jni-${{ hashFiles('android/**/*.gradle.kts', 'android/gradle/libs.versions.toml') }}
          restore-keys: gradle-jni-

      - name: Cache Cargo target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            external/ckb-light-client/target
          key: cargo-${{ hashFiles('external/ckb-light-client/Cargo.lock') }}
          restore-keys: cargo-

      - name: Create dummy google-services.json
        run: |
          cat > android/app/google-services.json << 'GSEOF'
          {
            "project_info": { "project_number": "0", "project_id": "dummy", "storage_bucket": "dummy.appspot.com" },
            "client": [{ "client_info": { "mobilesdk_app_id": "1:0:android:0", "android_client_info": { "package_name": "com.rjnr.pocketnode" } }, "api_key": [{ "current_key": "dummy" }] }],
            "configuration_version": "1"
          }
          GSEOF

      - name: Build debug APK with JNI + x86_64
        working-directory: android
        env:
          BUILD_X86_64: "1"
        run: ./gradlew assembleDebug

      - name: Upload prev-jni APK
        uses: actions/upload-artifact@v4
        with:
          name: pocketnode-prev-jni-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

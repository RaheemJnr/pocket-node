name: Upgrade Smoke

on:
  pull_request:
    branches: [main, codex/security-maintenance-batch-1, codex/dao-association-recovery]

concurrency:
  group: upgrade-smoke-${{ github.ref }}
  cancel-in-progress: true

# Skip-path posts a comment on the PR when no prev artifact exists.
permissions:
  contents: read
  pull-requests: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          # The legacy 'tools' package (the action's default) no longer exists in
          # cmdline-tools 16+ on the GitHub runner image; only platform-tools is needed.
          packages: platform-tools

      - name: Setup Android NDK
        # NDK r27c (27.0.12077973) — matches AGP 8.13.2 default. Bump in
        # lockstep with AGP. nttld/setup-ndk handles license + full extraction;
        # sdkmanager produced partial installs missing the llvm toolchain
        # ("clang not found in NDK").
        id: setup-ndk
        uses: nttld/setup-ndk@ed92fe6cadad69be94a966a7ee3271275e62f779 # v1
        with:
          ndk-version: r27c
          add-to-path: false
      - name: Export ANDROID_NDK_HOME
        env:
          NDK_PATH: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: echo "ANDROID_NDK_HOME=$NDK_PATH" >> "$GITHUB_ENV"

      - name: Set up pinned Rust with Android targets
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: "1.95.0"
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Cache Gradle
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ci-upgrade-smoke-${{ runner.os }}-gradle-jni-${{ hashFiles('android/**/*.gradle.kts', 'android/gradle/libs.versions.toml', 'android/gradle/verification-metadata.xml', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: ci-upgrade-smoke-${{ runner.os }}-gradle-jni-

      - name: Cache Cargo target
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            external/ckb-light-client/target
          key: ci-upgrade-smoke-${{ runner.os }}-cargo-${{ hashFiles('external/ckb-light-client/Cargo.lock') }}
          restore-keys: ci-upgrade-smoke-${{ runner.os }}-cargo-

      - name: Download prev main APK
        id: prev_apk
        uses: dawidd6/action-download-artifact@bf251b5aa9c2f7eeb574a96ee720e24f801b7c11 # v6
        with:
          workflow: android-ci.yml
          branch: main
          name: pocketnode-prev-jni-debug
          path: prev/
          if_no_artifact_found: warn

      - name: Skip job if no prev artifact
        if: steps.prev_apk.outputs.found_artifact != 'true'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            core.notice('Skipping upgrade-smoke: no prev artifact');
            // Only post a PR comment when triggered by a pull_request.
            // workflow_dispatch runs have no issue context — would 404.
            // Soft-fail the API call so a missing pull-requests:write
            // permission doesn't turn the skip-path into a job failure.
            if (context.eventName === 'pull_request' && context.issue && context.issue.number) {
              try {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.issue.number,
                  body: '⚠️ upgrade-smoke skipped: no `pocketnode-prev-jni-debug` artifact on main yet. Run android-ci.yml on main first, then re-run this job.'
                });
              } catch (e) {
                core.warning(`Could not post skip comment: ${e.message}`);
              }
            }

      - name: Create dummy google-services.json
        if: steps.prev_apk.outputs.found_artifact == 'true'
        run: |
          cat > android/app/google-services.json << 'GSEOF'
          {
            "project_info": { "project_number": "0", "project_id": "dummy", "storage_bucket": "dummy.appspot.com" },
            "client": [{ "client_info": { "mobilesdk_app_id": "1:0:android:0", "android_client_info": { "package_name": "com.rjnr.pocketnode" } }, "api_key": [{ "current_key": "dummy" }] }],
            "configuration_version": "1"
          }
          GSEOF

      - name: Build PR APK + androidTest APK
        if: steps.prev_apk.outputs.found_artifact == 'true'
        working-directory: android
        env:
          BUILD_X86_64: "1"
        run: ./gradlew assembleDebug assembleDebugAndroidTest

      - name: Enable KVM
        if: steps.prev_apk.outputs.found_artifact == 'true'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run upgrade-smoke on emulator
        if: steps.prev_apk.outputs.found_artifact == 'true'
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 34
          arch: x86_64
          target: default
          # Default 600 s flakes on slow shared runners — see #330 mode 2
          # (run 27303458847: "Timeout waiting for emulator to boot").
          emulator-boot-timeout: 900
          force-avd-creation: false
          # force-avd-creation: false already means "reuse an AVD if one
          # exists", but nothing here caches the AVD across runs, so every
          # run creates one fresh and then wastes time on a doomed
          # default_boot snapshot load ("Failed to load snapshot
          # 'default_boot'" in every run's log, pass or fail). -no-snapshot
          # skips that load-then-fallback-to-cold-boot round trip entirely.
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot
          disable-animations: true
          # The action's inline-script splitter mangles multi-line shell
          # constructs (functions, traps, if/fi). Invoke a real bash file
          # instead so everything runs in one shell process.
          script: bash .github/scripts/upgrade-smoke.sh

      - name: Upload smoke artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          # Suffix with attempt so a rerun can't clobber/409 the previous
          # attempt's fail-*.png/xml evidence (upload-artifact@v4 artifacts
          # are immutable per run).
          name: upgrade-smoke-artifacts-attempt-${{ github.run_attempt }}
          path: |
            seed.log
            post.log
            ui-dump.xml
            fail-*.png
            fail-*.xml
            logcat-post.txt
            post.png
          if-no-files-found: warn
          retention-days: 7

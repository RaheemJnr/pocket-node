name: PocketNode
options:
  bundleIdPrefix: com.rjnr
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  minimumXcodeGenVersion: "2.40.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    # The CkbLightClientFFI xcframework and PocketNodeCore.framework ship
    # arm64 device + arm64 simulator slices only (Apple Silicon).
    "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64

packages:
  CkbLightClient:
    path: Packages/CkbLightClient

targets:
  PocketNode:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: PocketNode
        excludes:
          - "Resources/**"
      - path: PocketNode/Resources
        buildPhase: resources
    dependencies:
      - package: CkbLightClient
    info:
      path: PocketNode/Info.plist
      properties:
        CFBundleDisplayName: Pocket Node
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Unwrapping the wallet's data key raises a Face ID prompt; without this
        # string iOS kills the app instead of showing it.
        NSFaceIDUsageDescription: Pocket Node uses Face ID to unlock your wallet keys.
        NSCameraUsageDescription: Pocket Node uses the camera to scan CKB addresses.
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # Suppresses the export-compliance prompt on every TestFlight upload:
        # the app only uses standard iOS crypto (no custom/non-exempt encryption).
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rjnr.pocketnode
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: NO
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        DEVELOPMENT_TEAM: ARF4H4N5CV
        CODE_SIGN_STYLE: Automatic
        FRAMEWORK_SEARCH_PATHS: $(inherited) $(SRCROOT)/../android/shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)
        OTHER_LDFLAGS: $(inherited) -framework PocketNodeCore
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    preBuildScripts:
      - name: Build PocketNodeCore (KMP)
        basedOnDependencyAnalysis: false
        script: |
          cd "$SRCROOT/../android" && ./gradlew :shared:embedAndSignAppleFrameworkForXcode

  PocketNodeTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - PocketNodeTests
    dependencies:
      - target: PocketNode
      - package: CkbLightClient
    settings:
      base:
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES
        # The tests import PocketNodeCore for the shared protocols. Only the
        # module map is needed here: the framework is static and already linked
        # into the host app, which the bundle loads its symbols from.
        FRAMEWORK_SEARCH_PATHS: $(inherited) $(SRCROOT)/../android/shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)

  PocketNodeUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - PocketNodeUITests
    dependencies:
      - target: PocketNode
    settings:
      base:
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: PocketNode

schemes:
  # The default, offline scheme: unit tests plus the offline UI tests
  # (`WalletShellUITests`, `OnboardingUITests`). `NodeStatusUITests` also builds
  # here (it lives in the same `PocketNodeUITests` target) but skips itself
  # with `XCTSkip` unless `POCKETNODE_NETWORK_TESTS=1`, which only the
  # `PocketNodeNetwork` scheme below sets. `ios-ci.yml` runs this scheme.
  PocketNode:
    build:
      targets:
        PocketNode: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - PocketNodeTests
        - PocketNodeUITests

  # Networked acceptance run: the one test in `PocketNodeUITests` that needs
  # real testnet bootnodes (`NodeStatusUITests`), gated on this variable so it
  # cannot silently no-op under the offline scheme above. Kept out of the
  # default scheme so CI and everyday test runs stay offline.
  PocketNodeNetwork:
    build:
      targets:
        PocketNode: all
    test:
      config: Debug
      targets:
        - PocketNodeUITests
      environmentVariables:
        POCKETNODE_NETWORK_TESTS: "1"

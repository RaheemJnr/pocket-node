# gitleaks config for Pocket Node. Extends the built-in default ruleset
# (generic-api-key, private-key blocks, cloud provider keys, etc.).
#
# There is no directory-wide allowlist: a new credential pasted into any file,
# test sources included, is reported. Known test fixtures (BIP-39/BIP-32
# vectors, dummy keys, the KeyBackupCompatibilityTest blob, dummy_pow.toml)
# and two reviewed false positives are listed by exact fingerprint in
# .gitleaksignore, so each new one has to be reviewed and added on purpose.

[extend]
useDefault = true

[allowlist]
description = "The ignore file itself, and the private key of the public all-abandon BIP-39 test vector"
paths = [
    '''^\.gitleaksignore$''',
]
# m/44'/309'/0'/0/0 private key of the standard all-"abandon ... about" BIP-39
# test phrase. Anyone can derive it from the public phrase; tests pin it on
# purpose. Matched by exact value so it is allowed in any file and any commit
# (a fingerprint would break on squash merges), and nothing else is.
regexes = [
    '''^b217d9a18ff657c99872cc11a2fa2aa3e970cef8c6faa7d6e424bf057cb3707b$''',
]

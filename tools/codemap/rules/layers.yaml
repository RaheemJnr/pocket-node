# First match wins. Order the list most-specific first.
# `order` drives left-to-right lane placement in the layered layout, and
# defines what counts as a backward (violating) edge.
layers:
  - id: jni
    order: 1
    label: JNI bridge
    match: ["**/jni_bridge/**", "**/ckblightclient/**"]

  - id: rust-core
    order: 0
    label: Rust core
    match: ["external/**"]

  - id: viewmodel
    order: 4
    label: ViewModel
    match: ["**/*ViewModel.kt"]

  - id: di
    order: 3
    label: DI
    match: ["**/di/**"]

  - id: data
    order: 2
    label: Data
    match:
      - "**/data/database/**"
      - "**/data/crypto/**"
      - "**/data/wallet/**"
      - "**/data/migration/**"
      - "**/data/auth/**"        # auth guards key material: same tier as the data it protects

  - id: domain
    order: 3
    label: Repository
    match: ["**/data/**"]

  - id: util
    order: 5
    label: Util
    match: ["**/util/**"]
    # A leaf everything may call. Depending on it is never a layering
    # violation, so it is exempt from the backward-edge check.
    leaf: true

  - id: ui
    order: 5
    label: UI
    match: ["**/ui/**"]

  - id: app
    order: 6
    label: App
    match: ["**/*.kt"]
